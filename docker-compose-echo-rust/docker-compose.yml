services:
  echo-server:
    build:
      context: ./server
    container_name: echo-server-rust
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5000' 2>/dev/null && exit 0 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5000:5000"

  echo-client:
    build:
      context: ./client
    container_name: echo-client-rust
    depends_on:
      echo-server:
        condition: service_healthy
    environment:
      ECHO_HOST: echo-server-rust
      ECHO_PORT: "5000"
      ECHO_MESSAGE: "Mensagem via Docker Compose (Rust)"
